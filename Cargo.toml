[package]
name = "funpay-tools-desktop"
version = "4.3.9"
edition = "2021"
build = "build.rs"

[dependencies]
slint = { version = "1.18", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "accessibility", "unstable-winit-030"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "rustls-tls-native-roots", "multipart", "gzip", "brotli", "json"] }
scraper = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
rfd = "0.15"
notify-rust = "4"
arboard = { version = "3", default-features = false, features = ["image-data"] }
open = "5"
directories = "5"
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
regex = "1"
once_cell = "1"
base64 = "0.22"
sha2 = "0.10"
semver = "1"

[build-dependencies]
slint-build = "1.18"
embed-resource = "3"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
wry = { version = "0.57", default-features = false, features = ["os-webview"] }
tauri-winrt-notification = "0.8"
rodio = { version = "0.21", default-features = false, features = ["playback", "symphonia-mp3"] }
tray-icon = { version = "0.21", default-features = false }

[patch.crates-io]
# Исправление деления на ноль при частоте монитора 0 Гц (RDP, виртуальные машины)
i-slint-backend-winit = { path = "patches/i-slint-backend-winit-1.18.1" }
# WebView2Loader.dll грузится при первом вызове, а не при старте exe (см. patches/webview2-com-sys)
webview2-com-sys = { path = "patches/webview2-com-sys-0.39.1" }
