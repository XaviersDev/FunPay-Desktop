name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux (ELF + AppImage)
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libfuse2

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build release binary
        run: cargo build --release

      - name: Build AppImage
        run: |
          chmod +x tools/build-appimage.sh
          ./tools/build-appimage.sh

      - name: Prepare release archive
        run: |
          mkdir -p dist
          cp target/release/funpay-tools-desktop dist/funpay-tools-desktop
          cp target/FunPay_Tools-x86_64.AppImage dist/FunPay_Tools-x86_64.AppImage
          tar -czvf dist/funpay-tools-desktop-linux-x86_64.tar.gz -C target/release funpay-tools-desktop
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/FunPay_Tools-x86_64.AppImage
            dist/funpay-tools-desktop
            dist/funpay-tools-desktop-linux-x86_64.tar.gz
            dist/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
